<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" role="img" aria-labelledby="title desc">
  <title id="title">Where an advisor intercepts a successful call</title>
  <desc id="desc">ChatClient sends a request. The advisor's before hook inspects it. ChatModel calls the LLM API and receives a response. The advisor's after hook inspects it before the application receives the answer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect width="560" height="640" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="280" y="40" fill="#475569" font-size="18" font-weight="700" letter-spacing="2">ONE SUCCESSFUL CALL</text>
    <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M280 138V174"/><path d="M280 246V282"/><path d="M280 354V390"/><path d="M280 462V498"/>
    </g>
    <rect x="48" y="66" width="464" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="280" y="96" fill="#0f172a" font-size="24" font-weight="700">ChatClient request</text>
    <text x="280" y="122" fill="#475569" font-size="20">Your prompt and tool definitions</text>
    <rect x="48" y="174" width="464" height="72" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="280" y="204" fill="#1e40af" font-size="24" font-weight="700">Advisor · before()</text>
    <text x="280" y="230" fill="#1e40af" font-size="20">Inspect or change the request</text>
    <rect x="48" y="282" width="464" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="280" y="312" fill="#0f172a" font-size="24" font-weight="700">ChatModel ↔ LLM API</text>
    <text x="280" y="338" fill="#475569" font-size="20">Send request · receive response</text>
    <rect x="48" y="390" width="464" height="72" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="280" y="420" fill="#1e40af" font-size="24" font-weight="700">Advisor · after()</text>
    <text x="280" y="446" fill="#1e40af" font-size="20">Inspect or change the response</text>
    <rect x="48" y="498" width="464" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="280" y="528" fill="#0f172a" font-size="24" font-weight="700">Application receives answer</text>
    <text x="280" y="554" fill="#475569" font-size="20">After the advisor has processed it</text>
    <text x="280" y="610" fill="#475569" font-size="18">Blue boxes are the advisor's interception points.</text>
  </g>
</svg>
