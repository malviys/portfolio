<svg xmlns="http://www.w3.org/2000/svg" width="480" height="896" viewBox="0 0 480 896" role="img" aria-labelledby="title desc">
<title id="title">The model requests tools and the application executes them</title>
<desc id="desc">In this illustrative clock interaction, the first model request sees a search tool and asks for discovery. The application searches its registered catalog. The second model request sees discovered definitions and requests the clock. The application executes the Java clock method and returns the timestamp. The third model request produces the answer. Real tasks can take a different number of iterations.</desc>
<metadata>Original explanatory diagram for Sourabh Malviya's blog. Basis: https://docs.spring.io/spring-ai/reference/guides/dynamic-tool-search.html</metadata>
<style>
  :root { color: #0f172a; --muted: #475569; --panel: #f1f5f9; --line: #94a3b8; --blue: #075985; --blue-bg: #e0f2fe; --green: #166534; --green-bg: #dcfce7; --orange: #9a3412; --orange-bg: #ffedd5; }
  @media (prefers-color-scheme: dark) {
    :root { color: #f1f5f9; --muted: #cbd5e1; --panel: #182332; --line: #64748b; --blue: #7dd3fc; --blue-bg: #0c3446; --green: #86efac; --green-bg: #143522; --orange: #fdba74; --orange-bg: #462916; }
  }
  text { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 22px; }
  .title { font-size: 26px; font-weight: 700; }
  .label { font-size: 20px; font-weight: 700; }
  .small { font-size: 19px; }
  .muted { fill: var(--muted); }
  .blue { fill: var(--blue); }
  .green { fill: var(--green); }
  .orange { fill: var(--orange); }
  .panel { fill: var(--panel); stroke: var(--line); }
  .blue-panel { fill: var(--blue-bg); stroke: var(--blue); }
  .green-panel { fill: var(--green-bg); stroke: var(--green); }
  .orange-panel { fill: var(--orange-bg); stroke: var(--orange); }
  .arrow { fill: none; stroke: var(--line); stroke-width: 2; marker-end: url(#arrow); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" style="fill:var(--line)"/></marker></defs>
<text x="24" y="42" class="title">Discovery comes before execution</text>
<text x="24" y="76" class="muted small">One possible clock-tool interaction</text>
<rect x="24" y="106" width="432" height="110" rx="12" class="blue-panel"/>
<text x="44" y="135" class="label blue">MODEL · REQUEST 1</text>
<text x="44" y="170">Ask to find a clock tool</text>
<text x="44" y="200" class="small muted">Sees the search-tool definition</text>
<path d="M240 216V246" class="arrow"/>
<rect x="24" y="252" width="432" height="110" rx="12" class="panel"/>
<text x="44" y="281" class="label ">APPLICATION</text>
<text x="44" y="316">Search the registered catalog</text>
<text x="44" y="346" class="small muted">Return matching tool definitions</text>
<path d="M240 362V392" class="arrow"/>
<rect x="24" y="398" width="432" height="110" rx="12" class="blue-panel"/>
<text x="44" y="427" class="label blue">MODEL · REQUEST 2</text>
<text x="44" y="462">Request the clock tool</text>
<text x="44" y="492" class="small muted">Sees the discovered definitions</text>
<path d="M240 508V538" class="arrow"/>
<rect x="24" y="544" width="432" height="110" rx="12" class="panel"/>
<text x="44" y="573" class="label ">APPLICATION</text>
<text x="44" y="608">Execute the Java clock tool</text>
<text x="44" y="638" class="small muted">Return its timestamp to the model</text>
<path d="M240 654V684" class="arrow"/>
<rect x="24" y="690" width="432" height="110" rx="12" class="blue-panel"/>
<text x="44" y="719" class="label blue">MODEL · REQUEST 3</text>
<text x="44" y="754">Answer using the timestamp</text>
<text x="44" y="784" class="small muted">No further tool call in this example</text>
<text x="24" y="839" class="muted small">The model requests; application code runs.</text>
<text x="24" y="867" class="muted small">Other tasks can need more iterations.</text>
</svg>
