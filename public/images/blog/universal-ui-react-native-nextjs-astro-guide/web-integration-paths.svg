<text x="100" y="425">Uniwind Vite integration</text>
<text x="100" y="465" class="green label">Working proof of concept</text>
<text x="100" y="496" class="small">Client-only component previews</text>
<rect x="80" y="562" width="376" height="166" rx="12" class="orange-panel"/>
